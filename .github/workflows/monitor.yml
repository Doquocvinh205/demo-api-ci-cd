name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        # Thay ID_CUA_COLLECTION_MONITOR bằng Collection ID copy từ Postman
        run: |
          postman collection run "59052417-f206d6c7-c096-45dc-8ebd-e6f0a3b5994a"
